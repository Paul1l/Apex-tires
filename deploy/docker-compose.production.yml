services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      # Schema owner: migrations and backups only (the image creates it as a
      # superuser). The running app uses POSTGRES_APP_USER (SEC-11).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by postgres/init/10-app-role.sql: on the first start of an empty
      # volume automatically, on an existing database by the command in
      # docs/VDS_DEPLOYMENT.md.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-apex_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    # Named so that the one-off `migrate` service runs the same build.
    image: apex-wheels-app:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_DEPLOYMENT_STAGE: production
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME}
        NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SELLER_LEGAL_NAME: ${NEXT_PUBLIC_SELLER_LEGAL_NAME}
        NEXT_PUBLIC_SELLER_LAST_NAME: ${NEXT_PUBLIC_SELLER_LAST_NAME}
        NEXT_PUBLIC_SELLER_FIRST_NAME: ${NEXT_PUBLIC_SELLER_FIRST_NAME}
        NEXT_PUBLIC_SELLER_PATRONYMIC: ${NEXT_PUBLIC_SELLER_PATRONYMIC}
        NEXT_PUBLIC_SELLER_LEGAL_ADDRESS: ${NEXT_PUBLIC_SELLER_LEGAL_ADDRESS}
        NEXT_PUBLIC_SELLER_ACTUAL_ADDRESS: ${NEXT_PUBLIC_SELLER_ACTUAL_ADDRESS}
        NEXT_PUBLIC_SELLER_RETURN_ADDRESS: ${NEXT_PUBLIC_SELLER_RETURN_ADDRESS}
        NEXT_PUBLIC_SELLER_INN: ${NEXT_PUBLIC_SELLER_INN}
        NEXT_PUBLIC_SELLER_OGRNIP: ${NEXT_PUBLIC_SELLER_OGRNIP}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
        NEXT_PUBLIC_ADDITIONAL_PHONES: ${NEXT_PUBLIC_ADDITIONAL_PHONES:-}
        NEXT_PUBLIC_STORE_ADDRESS: ${NEXT_PUBLIC_STORE_ADDRESS}
        NEXT_PUBLIC_STORE_LATITUDE: ${NEXT_PUBLIC_STORE_LATITUDE:-}
        NEXT_PUBLIC_STORE_LONGITUDE: ${NEXT_PUBLIC_STORE_LONGITUDE:-}
        NEXT_PUBLIC_TWO_GIS_URL: ${NEXT_PUBLIC_TWO_GIS_URL}
        NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL:-}
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
        NEXT_PUBLIC_VK_URL: ${NEXT_PUBLIC_VK_URL:-}
        NEXT_PUBLIC_WORKING_HOURS: ${NEXT_PUBLIC_WORKING_HOURS}
        NEXT_PUBLIC_PICKUP_ENABLED: ${NEXT_PUBLIC_PICKUP_ENABLED:-false}
        NEXT_PUBLIC_PICKUP_RULES: ${NEXT_PUBLIC_PICKUP_RULES:-}
        NEXT_PUBLIC_CITY_DELIVERY_ENABLED: ${NEXT_PUBLIC_CITY_DELIVERY_ENABLED:-false}
        NEXT_PUBLIC_CITY_DELIVERY_RULES: ${NEXT_PUBLIC_CITY_DELIVERY_RULES:-}
        NEXT_PUBLIC_REGIONAL_DELIVERY_ENABLED: ${NEXT_PUBLIC_REGIONAL_DELIVERY_ENABLED:-false}
        NEXT_PUBLIC_REGIONAL_DELIVERY_RULES: ${NEXT_PUBLIC_REGIONAL_DELIVERY_RULES:-}
        NEXT_PUBLIC_TIRE_SERVICE_ENABLED: ${NEXT_PUBLIC_TIRE_SERVICE_ENABLED:-false}
        NEXT_PUBLIC_TIRE_STORAGE_ENABLED: ${NEXT_PUBLIC_TIRE_STORAGE_ENABLED:-false}
        NEXT_PUBLIC_BALANCING_ENABLED: ${NEXT_PUBLIC_BALANCING_ENABLED:-false}
        NEXT_PUBLIC_INSTALLATION_ENABLED: ${NEXT_PUBLIC_INSTALLATION_ENABLED:-false}
        NEXT_PUBLIC_USED_PRODUCTS_ENABLED: ${NEXT_PUBLIC_USED_PRODUCTS_ENABLED:-false}
        NEXT_PUBLIC_RATINGS_ENABLED: ${NEXT_PUBLIC_RATINGS_ENABLED:-false}
        NEXT_PUBLIC_AVAILABILITY_DISPLAY_MODE: ${NEXT_PUBLIC_AVAILABILITY_DISPLAY_MODE:-available}
        NEXT_PUBLIC_CATALOG_DATA_MODE: database
    restart: unless-stopped
    environment:
      # Application role: data only, no DDL (deploy/postgres/init/10-app-role.sql).
      # The owner credentials are not passed to the running app.
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-apex_app}:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
      CATALOG_IMPORT_BATCH_SIZE: ${CATALOG_IMPORT_BATCH_SIZE:-1000}
      FITMENT_IMPORT_BATCH_SIZE: ${FITMENT_IMPORT_BATCH_SIZE:-1000}
      IMPORT_JOB_STALE_MINUTES: ${IMPORT_JOB_STALE_MINUTES:-30}
      ORDER_RESERVATION_TTL_HOURS: ${ORDER_RESERVATION_TTL_HOURS:-24}
      ORDER_NUMBER_PREFIX: ${ORDER_NUMBER_PREFIX:-AW}
      # Nginx in front of the app sets X-Real-IP from $remote_addr.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-nginx}
      # Empty values fall back to the defaults documented in .env.example.
      RATE_LIMIT_ORDERS_PER_IP: ${RATE_LIMIT_ORDERS_PER_IP:-}
      RATE_LIMIT_ORDERS_PER_CONTACT: ${RATE_LIMIT_ORDERS_PER_CONTACT:-}
      ORDER_MAX_ACTIVE_RESERVATIONS_PER_CONTACT: ${ORDER_MAX_ACTIVE_RESERVATIONS_PER_CONTACT:-}
      RATE_LIMIT_FITMENT_REQUESTS_PER_IP: ${RATE_LIMIT_FITMENT_REQUESTS_PER_IP:-}
      RATE_LIMIT_FITMENT_REQUESTS_PER_PHONE: ${RATE_LIMIT_FITMENT_REQUESTS_PER_PHONE:-}
      RATE_LIMIT_GUEST_CART_WRITES_PER_IP: ${RATE_LIMIT_GUEST_CART_WRITES_PER_IP:-}
      RATE_LIMIT_AUTH_CODE_REQUESTS_PER_IP: ${RATE_LIMIT_AUTH_CODE_REQUESTS_PER_IP:-}
      RATE_LIMIT_ONEC_REQUESTS_PER_IP: ${RATE_LIMIT_ONEC_REQUESTS_PER_IP:-}
      OTP_MAX_FAILED_ATTEMPTS_PER_EMAIL: ${OTP_MAX_FAILED_ATTEMPTS_PER_EMAIL:-}
      OTP_CODE_PEPPER: ${OTP_CODE_PEPPER}
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET}
      YANDEX_POSTBOX_ACCESS_KEY_ID: ${YANDEX_POSTBOX_ACCESS_KEY_ID}
      YANDEX_POSTBOX_SECRET_ACCESS_KEY: ${YANDEX_POSTBOX_SECRET_ACCESS_KEY}
      YANDEX_POSTBOX_FROM_EMAIL: ${YANDEX_POSTBOX_FROM_EMAIL}
      YANDEX_POSTBOX_FROM_NAME: ${NEXT_PUBLIC_BRAND_NAME}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
      ONEC_BASE_URL: ${ONEC_BASE_URL:-}
      ONEC_API_KEY: ${ONEC_API_KEY:-}
      YANDEX_METRIKA_COUNTER_ID: ${YANDEX_METRIKA_COUNTER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]

  # Migrations as the schema owner (POSTGRES_USER), started only on demand:
  #   docker compose --env-file .env.production -f deploy/docker-compose.production.yml run --rm migrate
  # Uses the image built for `app` (build app first); not started by `up`.
  migrate:
    image: apex-wheels-app:latest
    pull_policy: never
    profiles: ["tools"]
    restart: "no"
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  nginx:
    # Stable branch; patch releases arrive with `docker compose pull nginx`.
    image: nginx:1.30-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
      # Optional 1C address allowlist (docs/VDS_DEPLOYMENT.md). Keep it defined,
      # even empty: the nginx template refers to it.
      ONEC_ALLOWED_IPS: ${ONEC_ALLOWED_IPS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [app]
    networks: [frontend]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  frontend:
