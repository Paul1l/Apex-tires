services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./scripts/backup-postgres.sh:/scripts/backup-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_DEPLOYMENT_STAGE: production
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME}
        NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SELLER_LEGAL_NAME: ${NEXT_PUBLIC_SELLER_LEGAL_NAME}
        NEXT_PUBLIC_SELLER_LAST_NAME: ${NEXT_PUBLIC_SELLER_LAST_NAME}
        NEXT_PUBLIC_SELLER_FIRST_NAME: ${NEXT_PUBLIC_SELLER_FIRST_NAME}
        NEXT_PUBLIC_SELLER_PATRONYMIC: ${NEXT_PUBLIC_SELLER_PATRONYMIC}
        NEXT_PUBLIC_SELLER_LEGAL_ADDRESS: ${NEXT_PUBLIC_SELLER_LEGAL_ADDRESS}
        NEXT_PUBLIC_SELLER_ACTUAL_ADDRESS: ${NEXT_PUBLIC_SELLER_ACTUAL_ADDRESS}
        NEXT_PUBLIC_SELLER_RETURN_ADDRESS: ${NEXT_PUBLIC_SELLER_RETURN_ADDRESS}
        NEXT_PUBLIC_SELLER_INN: ${NEXT_PUBLIC_SELLER_INN}
        NEXT_PUBLIC_SELLER_OGRNIP: ${NEXT_PUBLIC_SELLER_OGRNIP}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
        NEXT_PUBLIC_ADDITIONAL_PHONES: ${NEXT_PUBLIC_ADDITIONAL_PHONES:-}
        NEXT_PUBLIC_STORE_ADDRESS: ${NEXT_PUBLIC_STORE_ADDRESS}
        NEXT_PUBLIC_STORE_LATITUDE: ${NEXT_PUBLIC_STORE_LATITUDE:-}
        NEXT_PUBLIC_STORE_LONGITUDE: ${NEXT_PUBLIC_STORE_LONGITUDE:-}
        NEXT_PUBLIC_TWO_GIS_URL: ${NEXT_PUBLIC_TWO_GIS_URL}
        NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL:-}
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
        NEXT_PUBLIC_VK_URL: ${NEXT_PUBLIC_VK_URL:-}
        NEXT_PUBLIC_WORKING_HOURS: ${NEXT_PUBLIC_WORKING_HOURS}
        NEXT_PUBLIC_PICKUP_ENABLED: ${NEXT_PUBLIC_PICKUP_ENABLED:-false}
        NEXT_PUBLIC_PICKUP_RULES: ${NEXT_PUBLIC_PICKUP_RULES:-}
        NEXT_PUBLIC_CITY_DELIVERY_ENABLED: ${NEXT_PUBLIC_CITY_DELIVERY_ENABLED:-false}
        NEXT_PUBLIC_CITY_DELIVERY_RULES: ${NEXT_PUBLIC_CITY_DELIVERY_RULES:-}
        NEXT_PUBLIC_REGIONAL_DELIVERY_ENABLED: ${NEXT_PUBLIC_REGIONAL_DELIVERY_ENABLED:-false}
        NEXT_PUBLIC_REGIONAL_DELIVERY_RULES: ${NEXT_PUBLIC_REGIONAL_DELIVERY_RULES:-}
        NEXT_PUBLIC_TIRE_SERVICE_ENABLED: ${NEXT_PUBLIC_TIRE_SERVICE_ENABLED:-false}
        NEXT_PUBLIC_TIRE_STORAGE_ENABLED: ${NEXT_PUBLIC_TIRE_STORAGE_ENABLED:-false}
        NEXT_PUBLIC_BALANCING_ENABLED: ${NEXT_PUBLIC_BALANCING_ENABLED:-false}
        NEXT_PUBLIC_INSTALLATION_ENABLED: ${NEXT_PUBLIC_INSTALLATION_ENABLED:-false}
        NEXT_PUBLIC_USED_PRODUCTS_ENABLED: ${NEXT_PUBLIC_USED_PRODUCTS_ENABLED:-false}
        NEXT_PUBLIC_RATINGS_ENABLED: ${NEXT_PUBLIC_RATINGS_ENABLED:-false}
        NEXT_PUBLIC_AVAILABILITY_DISPLAY_MODE: ${NEXT_PUBLIC_AVAILABILITY_DISPLAY_MODE:-available}
        NEXT_PUBLIC_CATALOG_DATA_MODE: database
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
      OTP_CODE_PEPPER: ${OTP_CODE_PEPPER}
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET}
      YANDEX_POSTBOX_ACCESS_KEY_ID: ${YANDEX_POSTBOX_ACCESS_KEY_ID}
      YANDEX_POSTBOX_SECRET_ACCESS_KEY: ${YANDEX_POSTBOX_SECRET_ACCESS_KEY}
      YANDEX_POSTBOX_FROM_EMAIL: ${YANDEX_POSTBOX_FROM_EMAIL}
      YANDEX_POSTBOX_FROM_NAME: ${NEXT_PUBLIC_BRAND_NAME}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
      ONEC_BASE_URL: ${ONEC_BASE_URL:-}
      ONEC_API_KEY: ${ONEC_API_KEY:-}
      YANDEX_METRIKA_COUNTER_ID: ${YANDEX_METRIKA_COUNTER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [app]
    networks: [frontend]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  frontend:
